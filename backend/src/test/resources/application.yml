server:
  port: 0

spring:
  application:
    name: bloodmatcher-test

  datasource:
    url: jdbc:h2:mem:bloodmatchertest;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ''

management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: BloodMatcherTestKeyForJWTGenerationWhichMustBeAtLeast256BitsLong2024
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  admin:
    email: admin@bloodmatcher.org
    password: AdminPassword123!
    name: System Administrator
